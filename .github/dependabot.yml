version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The frontend is built with Bun; frontend/bun.lock is the only lockfile.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v3 requires a separate decoder migration.
      - dependency-name: pymodes
        versions: [">=3"]
