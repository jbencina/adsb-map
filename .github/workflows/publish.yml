name: Publish

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g. v1.2.3
      - v*

# Avoid duplicate runs if a tag is somehow pushed twice.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Trusted publishing requires this environment to exist in
    # GitHub repo Settings → Environments and to be configured as
    # the trusted publisher in the PyPI project settings.
    environment:
      name: pypi
      url: https://pypi.org/p/adsb-map
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
      contents: write   # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage frontend into Python package
        run: |
          mkdir -p adsb/static
          find adsb/static -mindepth 1 ! -name .gitkeep -delete
          cp -r frontend/dist/. adsb/static/

      - name: Set up uv
        # setup-uv does not publish a floating major tag; pin to a specific version.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          NOTES=$(awk '/^## \[/{p=0} /^## \['"$VERSION"'\]/{p=1; next} p' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for $VERSION; release will use auto-generated notes."
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ steps.notes.outputs.notes }}" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "${{ steps.notes.outputs.notes }}" \
              dist/*.whl dist/*.tar.gz
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*.whl dist/*.tar.gz
          fi
