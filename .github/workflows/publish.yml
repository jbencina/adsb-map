name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    # Configure this environment as the trusted publisher in PyPI settings.
    environment:
      name: pypi
      url: https://pypi.org/p/adsb-map
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Publish validated distributions
        run: uv publish --trusted-publishing always dist/*

  release:
    name: Create GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$VERSION]" '
            /^## \[/ { printing = index($0, heading) == 1; next }
            printing { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -n "$(tr -d '[:space:]' < "$NOTES_FILE")" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$NOTES_FILE" dist/*.whl dist/*.tar.gz
          else
            echo "::warning::No CHANGELOG section found for $VERSION; using generated notes."
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --generate-notes dist/*.whl dist/*.tar.gz
          fi
