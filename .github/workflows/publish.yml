name: Publish

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g. v1.2.3
      - v*

# Avoid duplicate runs if a tag is somehow pushed twice.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Trusted publishing requires this environment to exist in
    # GitHub repo Settings → Environments and to be configured as
    # the trusted publisher in the PyPI project settings.
    environment:
      name: pypi
      url: https://pypi.org/p/adsb-map
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        # setup-uv does not publish a floating major tag; pin to a specific version.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
